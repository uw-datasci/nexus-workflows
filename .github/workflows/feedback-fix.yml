name: Feedback Fix

# When a feedback issue gets `route:agent`, Claude makes the change and this workflow opens a PR
# for a person to review. It never merges. If the agent can't finish, breaks a rule or the PR's
# quality gate fails twice, a developer takes over. The logic lives in scripts/feedback/fix.js and
# is documented in the README. Spec: Feedback loop §5 Fix.
#
# The model never runs in a job that holds a write token:
# - gate:    read-only GITHUB_TOKEN. Decides what to do (fix, retry, handoff, takeover, stop, skip).
# - stop:    occupies the issue's concurrency group, which cancels a running agent.
# - queue:   waits until no older agent run in the repo is still going (see scripts/feedback/queue.js).
# - agent:   read-only GITHUB_TOKEN + the Anthropic key. Runs Claude and uploads a patch.
# - publish: the nexus-feedback App token, no model. Guardrail, then commit, push and PR.
# - handoff: the App token, no model. Assigns a developer and swaps route:agent for route:dev.

on:
  workflow_call:
    inputs:
      infisical-project-slug:
        required: true
        type: string
        description: "The Infisical project slug that holds the feedback folder"
      infisical-secret-path:
        required: false
        type: string
        default: "/nexus-feedback"
        description: "Infisical folder with FEEDBACK_ANTHROPIC_API_KEY and the nexus-feedback App credentials"
      infisical-env-slug:
        required: false
        type: string
        default: "prod"
        description: "Infisical environment to read the feedback secrets from"
      config-path:
        required: false
        type: string
        default: ".github/feedback.yml"
        description: "Path of the feedback config in the calling repo"
      model:
        required: false
        type: string
        default: "claude-sonnet-5-5"
      max-turns:
        required: false
        type: number
        default: 40
      timeout-minutes:
        required: false
        type: number
        default: 20
        description: "Time limit for the agent itself (waiting in the queue doesn't count)"
      node-version:
        required: false
        type: string
        default: "24"
      pnpm-version:
        required: false
        type: string
        default: ""
        description: "pnpm version (default: the packageManager field in package.json)"
      install-command:
        required: false
        type: string
        default: pnpm install --frozen-lockfile
      lint-command:
        required: false
        type: string
        default: pnpm lint
      typecheck-command:
        required: false
        type: string
        default: pnpm typecheck
      queue-workflows:
        required: false
        type: string
        default: ""
        description: "Other workflow files whose agent runs share this repo's one-at-a-time queue, e.g. 'claude.yml'"
      queue-timeout-minutes:
        required: false
        type: number
        default: 90
        description: "How long to wait for other agent runs before handing the issue to a developer"
      allowed-bots:
        required: false
        type: string
        default: "nexus-feedback[bot]"
        description: "Bot users allowed to start the agent. Triage adds route:agent as the App, so it must be listed"
      workflows-ref:
        required: false
        type: string
        default: "v4"
        description: "Ref of uw-datasci/nexus-workflows to load the feedback scripts from (match the ref you call this workflow at)"
    secrets:
      INFISICAL_CLIENT_ID:
        required: true
      INFISICAL_CLIENT_SECRET:
        required: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      reason: ${{ steps.gate.outputs.reason }}
      issue-number: ${{ steps.gate.outputs.issue-number }}
      base: ${{ steps.gate.outputs.base }}
      branch: ${{ steps.gate.outputs.branch }}
      branch-exists: ${{ steps.gate.outputs.branch-exists }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
      retries: ${{ steps.gate.outputs.retries }}
      failed-run-id: ${{ steps.gate.outputs.failed-run-id }}
      config: ${{ steps.gate.outputs.config }}
    steps:
      # Always the default branch, so the config never comes from a branch the agent wrote.
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout feedback scripts
        uses: actions/checkout@v6
        with:
          repository: uw-datasci/nexus-workflows
          ref: ${{ inputs.workflows-ref }}
          path: .nexus-workflows
          persist-credentials: false

      - name: Read feedback config
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          mkdir -p .feedback
          if [ -f "$CONFIG_PATH" ]; then
            yq -o=json '.' "$CONFIG_PATH" > .feedback/config.raw.json
          fi

      - name: Decide what to do
        id: gate
        uses: actions/github-script@v9
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        with:
          script: |
            const { stepGate } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/fix.js`);
            await stepGate({ github, context, core });

  # A person switched the issue away from route:agent. Joining the issue's concurrency group
  # cancels any agent run still going for it.
  stop:
    name: Stop agent
    needs: gate
    if: needs.gate.outputs.mode == 'stop' || needs.gate.outputs.mode == 'takeover'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    concurrency:
      group: feedback-fix-${{ github.repository }}-${{ needs.gate.outputs.issue-number }}
      cancel-in-progress: true
    steps:
      - name: Stop
        env:
          ISSUE_NUMBER: ${{ needs.gate.outputs.issue-number }}
        run: |
          echo "Stopped any agent run for issue $ISSUE_NUMBER."

  # Its own job, so the agent job checks out the branch only once it's this run's turn (an
  # earlier @claude run may have pushed to it in the meantime).
  queue:
    name: Queue (#${{ needs.gate.outputs.issue-number }})
    needs: gate
    if: needs.gate.outputs.mode == 'fix' || needs.gate.outputs.mode == 'retry'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    concurrency:
      group: feedback-fix-${{ github.repository }}-${{ needs.gate.outputs.issue-number }}
      cancel-in-progress: true
    outputs:
      ready: ${{ steps.queue.outputs.ready }}
      reason: ${{ steps.queue.outputs.reason }}
    steps:
      - name: Checkout feedback scripts
        uses: actions/checkout@v6
        with:
          repository: uw-datasci/nexus-workflows
          ref: ${{ inputs.workflows-ref }}
          path: .nexus-workflows
          persist-credentials: false

      - name: Wait for other agent runs
        id: queue
        uses: actions/github-script@v9
        env:
          QUEUE_WORKFLOWS: ${{ inputs.queue-workflows }}
          QUEUE_TIMEOUT_MINUTES: ${{ inputs.queue-timeout-minutes }}
        with:
          script: |
            const { stepWait } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/agent-run.js`);
            await stepWait({ github, context, core });

  agent:
    name: Agent (#${{ needs.gate.outputs.issue-number }})
    needs: [gate, queue]
    if: needs.queue.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Install + agent. The agent step has its own limit; this is only a backstop.
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      packages: read
    concurrency:
      group: feedback-fix-${{ github.repository }}-${{ needs.gate.outputs.issue-number }}
      cancel-in-progress: true
    outputs:
      handoff-reason: ${{ steps.result.outputs.handoff-reason }}
      has-patch: ${{ steps.result.outputs.has-patch }}
      start-sha: ${{ steps.start.outputs.sha }}
      changes: ${{ steps.result.outputs.changes }}
      notes: ${{ steps.result.outputs.notes }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.branch-exists == 'true' && needs.gate.outputs.branch || needs.gate.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record starting commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout feedback scripts
        uses: actions/checkout@v6
        with:
          repository: uw-datasci/nexus-workflows
          ref: ${{ inputs.workflows-ref }}
          path: .nexus-workflows
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@uw-datasci"

      - name: Install dependencies
        timeout-minutes: 15
        run: ${{ inputs.install-command }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Collect issue context
        id: prepare
        uses: actions/github-script@v9
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.issue-number }}
          BASE: ${{ needs.gate.outputs.base }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          BRANCH_EXISTS: ${{ needs.gate.outputs.branch-exists }}
          FAILED_RUN_ID: ${{ needs.gate.outputs.failed-run-id }}
          CONFIG: ${{ needs.gate.outputs.config }}
          LINT_COMMAND: ${{ inputs.lint-command }}
          TYPECHECK_COMMAND: ${{ inputs.typecheck-command }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { stepPrepare } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/fix.js`);
            await stepPrepare({ github, context, core });

      # Exported to a file, not the environment, so this job only ever holds the Anthropic key.
      - name: Pull secrets from Infisical
        uses: infisical/secrets-action@v1.0.16
        with:
          env-slug: ${{ inputs.infisical-env-slug }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ inputs.infisical-project-slug }}
          secret-path: ${{ inputs.infisical-secret-path }}
          export-type: file
          file-output-path: /.feedback-secrets.env

      - name: Read Anthropic key
        id: secrets
        uses: actions/github-script@v9
        with:
          script: |
            const { readSecrets } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/secrets.js`);
            readSecrets({
              file: `${process.env.GITHUB_WORKSPACE}/.feedback-secrets.env`,
              outputs: { "anthropic-api-key": ["FEEDBACK_ANTHROPIC_API_KEY"] },
              core,
            });

      # The app's lint and typecheck would check these scripts too.
      - name: Move feedback scripts out of the workspace
        run: mv .nexus-workflows "$RUNNER_TEMP/nexus-workflows"

      # Edits files and runs lint/typecheck only. The token can't push, and the next step turns
      # whatever it changed into a patch that the publish job checks before pushing.
      - name: Fix agent
        id: agent
        continue-on-error: true
        timeout-minutes: ${{ inputs.timeout-minutes }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ steps.secrets.outputs.anthropic-api-key }}
          github_token: ${{ github.token }}
          allowed_bots: ${{ inputs.allowed-bots }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools '${{ steps.prepare.outputs.allowed-tools }}'
            --disallowedTools WebFetch,WebSearch,NotebookEdit
            --json-schema '${{ steps.prepare.outputs.schema }}'

      - name: Put feedback scripts back
        if: always()
        run: |
          rm -rf .nexus-workflows
          mv "$RUNNER_TEMP/nexus-workflows" .nexus-workflows

      - name: Collect the change
        id: result
        uses: actions/github-script@v9
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          STRUCTURED_OUTPUT: ${{ steps.agent.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          MAX_TURNS: ${{ inputs.max-turns }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        with:
          script: |
            const { stepResult } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/fix.js`);
            stepResult({ core });

      - name: Upload the change
        if: steps.result.outputs.has-patch == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: feedback-fix-patch
          path: ${{ runner.temp }}/feedback-fix/changes.patch
          if-no-files-found: error
          retention-days: 3

      - name: Remove secrets file
        if: always()
        run: rm -f .feedback-secrets.env

  publish:
    name: Publish (#${{ needs.gate.outputs.issue-number }})
    needs: [gate, agent]
    if: ${{ !cancelled() && needs.agent.result == 'success' && needs.agent.outputs.has-patch == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: feedback-fix-${{ github.repository }}-${{ needs.gate.outputs.issue-number }}
      cancel-in-progress: true
    outputs:
      handoff-reasons: ${{ steps.publish.outputs.handoff-reasons }}
      files: ${{ steps.publish.outputs.files }}
      pr-number: ${{ steps.publish.outputs.pr-number }}
    steps:
      # The exact commit the agent started from, so its patch applies cleanly. Full history for the
      # guardrail's diff against the base branch.
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.agent.outputs.start-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout feedback scripts
        uses: actions/checkout@v6
        with:
          repository: uw-datasci/nexus-workflows
          ref: ${{ inputs.workflows-ref }}
          path: .nexus-workflows
          persist-credentials: false

      - name: Download the change
        uses: actions/download-artifact@v8
        with:
          name: feedback-fix-patch
          path: ${{ runner.temp }}/feedback-fix

      - name: Pull secrets from Infisical
        uses: infisical/secrets-action@v1.0.16
        with:
          env-slug: ${{ inputs.infisical-env-slug }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ inputs.infisical-project-slug }}
          secret-path: ${{ inputs.infisical-secret-path }}
          export-type: file
          file-output-path: /.feedback-secrets.env

      - name: Read App credentials
        id: secrets
        uses: actions/github-script@v9
        with:
          script: |
            const { readSecrets } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/secrets.js`);
            readSecrets({
              file: `${process.env.GITHUB_WORKSPACE}/.feedback-secrets.env`,
              outputs: {
                "client-id": ["FEEDBACK_APP_CLIENT_ID", "FEEDBACK_APP_ID"],
                "private-key": ["FEEDBACK_APP_PRIVATE_KEY"],
              },
              core,
            });

      # No `workflows` permission, so this token can't change workflow files either.
      - name: Create nexus-feedback App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.secrets.outputs.client-id }}
          private-key: ${{ steps.secrets.outputs.private-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-organization-projects: ${{ fromJSON(needs.gate.outputs.config || '{}').project && 'write' || '' }}

      - name: Check, push and open the PR
        id: publish
        uses: actions/github-script@v9
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.issue-number }}
          BASE: ${{ needs.gate.outputs.base }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          PR_NUMBER: ${{ needs.gate.outputs.pr-number }}
          RETRIES: ${{ needs.gate.outputs.retries }}
          CONFIG: ${{ needs.gate.outputs.config }}
          CHANGES: ${{ needs.agent.outputs.changes }}
          NOTES: ${{ needs.agent.outputs.notes }}
          PATCH_FILE: ${{ runner.temp }}/feedback-fix/changes.patch
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { stepPublish } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/fix.js`);
            await stepPublish({ github, context, core });

      - name: Remove secrets file
        if: always()
        run: rm -f .feedback-secrets.env

  handoff:
    name: Hand off
    needs: [gate, queue, agent, publish]
    if: >-
      ${{ !cancelled() && (
        needs.gate.outputs.mode == 'handoff' ||
        needs.gate.outputs.mode == 'takeover' ||
        ((needs.gate.outputs.mode == 'fix' || needs.gate.outputs.mode == 'retry') && (
          needs.queue.result == 'failure' ||
          needs.queue.outputs.reason != '' ||
          needs.agent.result == 'failure' ||
          needs.agent.outputs.handoff-reason != '' ||
          needs.publish.result == 'failure' ||
          needs.publish.outputs.handoff-reasons != ''))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout feedback scripts
        uses: actions/checkout@v6
        with:
          repository: uw-datasci/nexus-workflows
          ref: ${{ inputs.workflows-ref }}
          path: .nexus-workflows
          persist-credentials: false

      - name: Pull secrets from Infisical
        uses: infisical/secrets-action@v1.0.16
        with:
          env-slug: ${{ inputs.infisical-env-slug }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ inputs.infisical-project-slug }}
          secret-path: ${{ inputs.infisical-secret-path }}
          export-type: file
          file-output-path: /.feedback-secrets.env

      - name: Read App credentials
        id: secrets
        uses: actions/github-script@v9
        with:
          script: |
            const { readSecrets } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/secrets.js`);
            readSecrets({
              file: `${process.env.GITHUB_WORKSPACE}/.feedback-secrets.env`,
              outputs: {
                "client-id": ["FEEDBACK_APP_CLIENT_ID", "FEEDBACK_APP_ID"],
                "private-key": ["FEEDBACK_APP_PRIVATE_KEY"],
              },
              core,
            });

      - name: Create nexus-feedback App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.secrets.outputs.client-id }}
          private-key: ${{ steps.secrets.outputs.private-key }}
          permission-issues: write
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
          permission-organization-projects: ${{ fromJSON(needs.gate.outputs.config || '{}').project && 'write' || '' }}

      - name: Hand off to a developer
        uses: actions/github-script@v9
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.issue-number }}
          CONFIG: ${{ needs.gate.outputs.config }}
          QUEUE_RESULT: ${{ needs.queue.result }}
          QUEUE_REASON: ${{ needs.queue.outputs.reason }}
          AGENT_RESULT: ${{ needs.agent.result }}
          AGENT_REASON: ${{ needs.agent.outputs.handoff-reason }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_REASONS: ${{ needs.publish.outputs.handoff-reasons }}
          FILES: ${{ needs.publish.outputs.files }}
          PR_NUMBER: ${{ needs.gate.outputs.pr-number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { stepHandoff } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/fix.js`);
            await stepHandoff({ github, context, core });

      - name: Remove secrets file
        if: always()
        run: rm -f .feedback-secrets.env
