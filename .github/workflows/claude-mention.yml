name: Claude Mention

# `@claude` on a feedback PR (head branch feedback/*): Claude makes the requested change on the
# PR's branch, or answers, and the workflow replies on the PR. People need write access; bots must
# be listed in allowed-bots. The logic lives in scripts/feedback/mention.js and is documented in
# the README. Spec: Feedback loop §5 Fix ("Review iterations").
#
# The model never runs in a job that holds a write token:
# - gate:  read-only GITHUB_TOKEN. Decides whether this comment counts.
# - ack:   the nexus-feedback App token, no model. Reacts 👀 to the comment.
# - queue: waits until no older agent run in the repo is still going (shared with the fix workflow).
# - agent: read-only GITHUB_TOKEN + the Anthropic key. Runs Claude and uploads a patch.
# - reply: the App token, no model. Guardrail, then push, then a reply on the PR.

on:
  workflow_call:
    inputs:
      infisical-project-slug:
        required: true
        type: string
        description: "The Infisical project slug that holds the feedback folder"
      infisical-secret-path:
        required: false
        type: string
        default: "/nexus-feedback"
        description: "Infisical folder with FEEDBACK_ANTHROPIC_API_KEY and the nexus-feedback App credentials"
      infisical-env-slug:
        required: false
        type: string
        default: "prod"
        description: "Infisical environment to read the feedback secrets from"
      config-path:
        required: false
        type: string
        default: ".github/feedback.yml"
        description: "Path of the feedback config in the calling repo"
      model:
        required: false
        type: string
        default: "claude-sonnet-5-5"
      max-turns:
        required: false
        type: number
        default: 30
      timeout-minutes:
        required: false
        type: number
        default: 15
        description: "Time limit for the agent itself (waiting in the queue doesn't count)"
      node-version:
        required: false
        type: string
        default: "24"
      pnpm-version:
        required: false
        type: string
        default: ""
        description: "pnpm version (default: the packageManager field in package.json)"
      install-command:
        required: false
        type: string
        default: pnpm install --frozen-lockfile
      lint-command:
        required: false
        type: string
        default: pnpm lint
      typecheck-command:
        required: false
        type: string
        default: pnpm typecheck
      queue-workflows:
        required: false
        type: string
        default: ""
        description: "Other workflow files whose agent runs share this repo's one-at-a-time queue, e.g. 'feedback-fix.yml'"
      queue-timeout-minutes:
        required: false
        type: number
        default: 90
        description: "How long to wait for other agent runs before replying that the queue was busy"
      allowed-bots:
        required: false
        type: string
        default: "nexus-feedback[bot]"
        description: "Bot users whose @claude comments start a run (the App relays Discord feedback this way)"
      workflows-ref:
        required: false
        type: string
        default: "v4"
        description: "Ref of uw-datasci/nexus-workflows to load the feedback scripts from (match the ref you call this workflow at)"
    secrets:
      INFISICAL_CLIENT_ID:
        required: true
      INFISICAL_CLIENT_SECRET:
        required: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      reason: ${{ steps.gate.outputs.reason }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
      issue-number: ${{ steps.gate.outputs.issue-number }}
      base: ${{ steps.gate.outputs.base }}
      branch: ${{ steps.gate.outputs.branch }}
      config: ${{ steps.gate.outputs.config }}
    steps:
      # Always the default branch: review events would otherwise check out the PR, and the config
      # must never come from a branch the agent wrote.
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout feedback scripts
        uses: actions/checkout@v6
        with:
          repository: uw-datasci/nexus-workflows
          ref: ${{ inputs.workflows-ref }}
          path: .nexus-workflows
          persist-credentials: false

      - name: Read feedback config
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          mkdir -p .feedback
          if [ -f "$CONFIG_PATH" ]; then
            yq -o=json '.' "$CONFIG_PATH" > .feedback/config.raw.json
          fi

      - name: Decide whether to run
        id: gate
        uses: actions/github-script@v9
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          ALLOWED_BOTS: ${{ inputs.allowed-bots }}
        with:
          script: |
            const { stepGate } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/mention.js`);
            await stepGate({ github, context, core });

  ack:
    name: Acknowledge
    needs: gate
    if: needs.gate.outputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout feedback scripts
        uses: actions/checkout@v6
        with:
          repository: uw-datasci/nexus-workflows
          ref: ${{ inputs.workflows-ref }}
          path: .nexus-workflows
          persist-credentials: false

      - name: Pull secrets from Infisical
        uses: infisical/secrets-action@v1.0.16
        with:
          env-slug: ${{ inputs.infisical-env-slug }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ inputs.infisical-project-slug }}
          secret-path: ${{ inputs.infisical-secret-path }}
          export-type: file
          file-output-path: /.feedback-secrets.env

      - name: Read App credentials
        id: secrets
        uses: actions/github-script@v9
        with:
          script: |
            const { readSecrets } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/secrets.js`);
            readSecrets({
              file: `${process.env.GITHUB_WORKSPACE}/.feedback-secrets.env`,
              outputs: {
                "client-id": ["FEEDBACK_APP_CLIENT_ID", "FEEDBACK_APP_ID"],
                "private-key": ["FEEDBACK_APP_PRIVATE_KEY"],
              },
              core,
            });

      - name: Create nexus-feedback App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.secrets.outputs.client-id }}
          private-key: ${{ steps.secrets.outputs.private-key }}
          permission-issues: write
          permission-pull-requests: write

      - name: React to the comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { stepAck } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/mention.js`);
            await stepAck({ github, context, core });

      - name: Remove secrets file
        if: always()
        run: rm -f .feedback-secrets.env

  # Its own job, so the agent job checks out the branch only once it's this run's turn.
  queue:
    name: Queue
    needs: gate
    if: needs.gate.outputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.queue.outputs.ready }}
      reason: ${{ steps.queue.outputs.reason }}
    steps:
      - name: Checkout feedback scripts
        uses: actions/checkout@v6
        with:
          repository: uw-datasci/nexus-workflows
          ref: ${{ inputs.workflows-ref }}
          path: .nexus-workflows
          persist-credentials: false

      - name: Wait for other agent runs
        id: queue
        uses: actions/github-script@v9
        env:
          QUEUE_WORKFLOWS: ${{ inputs.queue-workflows }}
          QUEUE_TIMEOUT_MINUTES: ${{ inputs.queue-timeout-minutes }}
        with:
          script: |
            const { stepWait } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/agent-run.js`);
            await stepWait({ github, context, core });

  agent:
    name: Agent (PR #${{ needs.gate.outputs.pr-number }})
    needs: [gate, queue]
    if: needs.queue.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Install + agent. The agent step has its own limit; this is only a backstop.
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
      packages: read
    outputs:
      problem: ${{ steps.result.outputs.problem }}
      has-patch: ${{ steps.result.outputs.has-patch }}
      verdict: ${{ steps.result.outputs.verdict }}
      start-sha: ${{ steps.start.outputs.sha }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record starting commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout feedback scripts
        uses: actions/checkout@v6
        with:
          repository: uw-datasci/nexus-workflows
          ref: ${{ inputs.workflows-ref }}
          path: .nexus-workflows
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@uw-datasci"

      - name: Install dependencies
        timeout-minutes: 15
        run: ${{ inputs.install-command }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Collect PR context
        id: prepare
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr-number }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.issue-number }}
          BASE: ${{ needs.gate.outputs.base }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          CONFIG: ${{ needs.gate.outputs.config }}
          LINT_COMMAND: ${{ inputs.lint-command }}
          TYPECHECK_COMMAND: ${{ inputs.typecheck-command }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { stepPrepare } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/mention.js`);
            await stepPrepare({ github, context, core });

      # Exported to a file, not the environment, so this job only ever holds the Anthropic key.
      - name: Pull secrets from Infisical
        uses: infisical/secrets-action@v1.0.16
        with:
          env-slug: ${{ inputs.infisical-env-slug }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ inputs.infisical-project-slug }}
          secret-path: ${{ inputs.infisical-secret-path }}
          export-type: file
          file-output-path: /.feedback-secrets.env

      - name: Read Anthropic key
        id: secrets
        uses: actions/github-script@v9
        with:
          script: |
            const { readSecrets } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/secrets.js`);
            readSecrets({
              file: `${process.env.GITHUB_WORKSPACE}/.feedback-secrets.env`,
              outputs: { "anthropic-api-key": ["FEEDBACK_ANTHROPIC_API_KEY"] },
              core,
            });

      # The app's lint and typecheck would check these scripts too.
      - name: Move feedback scripts out of the workspace
        run: mv .nexus-workflows "$RUNNER_TEMP/nexus-workflows"

      # Edits files and runs lint/typecheck only. The token can't push, and the next step turns
      # whatever it changed into a patch that the reply job checks before pushing.
      - name: Claude
        id: agent
        continue-on-error: true
        timeout-minutes: ${{ inputs.timeout-minutes }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ steps.secrets.outputs.anthropic-api-key }}
          github_token: ${{ github.token }}
          allowed_bots: ${{ inputs.allowed-bots }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools '${{ steps.prepare.outputs.allowed-tools }}'
            --disallowedTools WebFetch,WebSearch,NotebookEdit
            --json-schema '${{ steps.prepare.outputs.schema }}'

      - name: Put feedback scripts back
        if: always()
        run: |
          rm -rf .nexus-workflows
          mv "$RUNNER_TEMP/nexus-workflows" .nexus-workflows

      - name: Collect the change
        id: result
        uses: actions/github-script@v9
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          STRUCTURED_OUTPUT: ${{ steps.agent.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          MAX_TURNS: ${{ inputs.max-turns }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        with:
          script: |
            const { stepResult } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/mention.js`);
            stepResult({ core });

      - name: Upload the change
        if: steps.result.outputs.has-patch == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: feedback-mention-patch
          path: ${{ runner.temp }}/feedback-mention/changes.patch
          if-no-files-found: error
          retention-days: 3

      - name: Remove secrets file
        if: always()
        run: rm -f .feedback-secrets.env

  reply:
    name: Push and reply
    needs: [gate, queue, agent]
    if: ${{ !cancelled() && (needs.gate.outputs.mode == 'run' || needs.gate.outputs.mode == 'refuse') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The exact commit the agent started from, so its patch applies cleanly. Full history for the
      # guardrail's diff against the base branch.
      - name: Checkout PR branch
        if: needs.agent.outputs.has-patch == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.agent.outputs.start-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout feedback scripts
        uses: actions/checkout@v6
        with:
          repository: uw-datasci/nexus-workflows
          ref: ${{ inputs.workflows-ref }}
          path: .nexus-workflows
          persist-credentials: false

      - name: Download the change
        if: needs.agent.outputs.has-patch == 'true'
        uses: actions/download-artifact@v8
        with:
          name: feedback-mention-patch
          path: ${{ runner.temp }}/feedback-mention

      - name: Pull secrets from Infisical
        uses: infisical/secrets-action@v1.0.16
        with:
          env-slug: ${{ inputs.infisical-env-slug }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ inputs.infisical-project-slug }}
          secret-path: ${{ inputs.infisical-secret-path }}
          export-type: file
          file-output-path: /.feedback-secrets.env

      - name: Read App credentials
        id: secrets
        uses: actions/github-script@v9
        with:
          script: |
            const { readSecrets } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/secrets.js`);
            readSecrets({
              file: `${process.env.GITHUB_WORKSPACE}/.feedback-secrets.env`,
              outputs: {
                "client-id": ["FEEDBACK_APP_CLIENT_ID", "FEEDBACK_APP_ID"],
                "private-key": ["FEEDBACK_APP_PRIVATE_KEY"],
              },
              core,
            });

      # No `workflows` permission, so this token can't change workflow files either.
      - name: Create nexus-feedback App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.secrets.outputs.client-id }}
          private-key: ${{ steps.secrets.outputs.private-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Check, push and reply
        uses: actions/github-script@v9
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          PR_NUMBER: ${{ needs.gate.outputs.pr-number }}
          BASE: ${{ needs.gate.outputs.base }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          CONFIG: ${{ needs.gate.outputs.config }}
          QUEUE_RESULT: ${{ needs.queue.result }}
          QUEUE_REASON: ${{ needs.queue.outputs.reason }}
          AGENT_RESULT: ${{ needs.agent.result }}
          PROBLEM: ${{ needs.agent.outputs.problem }}
          VERDICT: ${{ needs.agent.outputs.verdict }}
          HAS_PATCH: ${{ needs.agent.outputs.has-patch }}
          PATCH_FILE: ${{ runner.temp }}/feedback-mention/changes.patch
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { stepReply } = require(`${process.env.GITHUB_WORKSPACE}/.nexus-workflows/scripts/feedback/mention.js`);
            await stepReply({ github, context, core });

      - name: Remove secrets file
        if: always()
        run: rm -f .feedback-secrets.env
