name: Dispatch Docs Update

on:
  workflow_call:
    inputs:
      app-name:
        description: "Display name of the application, used as the changelog heading (e.g. 🎯 Main Website)"
        required: true
        type: string
      section-map:
        description: >-
          Optional mapping of source path prefixes to changelog headings for repos that
          host multiple apps, one "<path-prefix> => <heading>" per line
          (e.g. "apps/web => 🎯 Main Website"). Changes that match no prefix fall back
          to app-name.
        required: false
        type: string
        default: ""
      docs-repo:
        description: "Repository that hosts the docs app"
        required: false
        type: string
        default: uw-datasci/nexus-docs
    secrets:
      DOCS_DISPATCH_TOKEN:
        description: "Token with contents write access to the docs repo, used to send the repository_dispatch"
        required: true

jobs:
  dispatch:
    name: Dispatch Docs Update
    # Only dispatch for merged PRs authored by humans that are not opted out of docs
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'no documentation')
    runs-on: ubuntu-latest

    steps:
      - name: Send repository_dispatch to Docs Repo
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          APP_NAME: ${{ inputs.app-name }}
          SECTION_MAP: ${{ inputs.section-map }}
          DOCS_REPO: ${{ inputs.docs-repo }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          # The docs repo resolves the semester itself from the website's terms table.
          # All this decides is which of its two paths runs.
          DOCS_MODE: ${{ contains(github.event.pull_request.labels.*.name, 'general docs') && 'general' || 'changelog' }}
        run: |
          gh api "repos/${DOCS_REPO}/dispatches" \
            -f event_type=update-docs \
            -f "client_payload[app_name]=${APP_NAME}" \
            -f "client_payload[section_map]=${SECTION_MAP}" \
            -f "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[pr_number]=${PR_NUMBER}" \
            -f "client_payload[pr_title]=${PR_TITLE}" \
            -f "client_payload[merge_sha]=${MERGE_SHA}" \
            -f "client_payload[docs_mode]=${DOCS_MODE}"
          echo "Dispatched update-docs (${DOCS_MODE}) to ${DOCS_REPO} for PR #${PR_NUMBER} (${MERGE_SHA})"
